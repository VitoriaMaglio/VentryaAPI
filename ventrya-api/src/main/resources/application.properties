spring.application.name=ventrya-api
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Servidor
server.port=${PORT:8080}
server.address=0.0.0.0

# Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.table=flyway_ventrya_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Spring Security / JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
# Spring AI - Ollama
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:qwen2.5:3b}
spring.ai.ollama.chat.options.temperature=0.2

# RabbitMQ local (variáveis de ambiente)
# RabbitMQ - CloudAMQP
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://localhost:5672}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Falha no consumidor vai para fila morta; sem loop infinito de reentrega

# Escolha um modelo disponível na sua conta
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

logging.level.org.springframework.security=DEBUG

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

